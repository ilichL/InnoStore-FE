@if (isOpen()) {
  <div class="modal-backdrop" (click)="closeModal.emit()">
    <div class="dropdown-content" (click)="$event.stopPropagation()">
      <div class="user-info-section">
        <div class="user-details">
          <h1 class="user-name">{{ userDetails()?.name || 'User' }}</h1>
          <p class="user-title">
            {{ userDetails()?.email || userDetails()?.nickname || '' }}
          </p>
        </div>

        <button type="button" class="nav-icon" (click)="goToProfile()" aria-label="Go to profile">
          &#8250;
        </button>
      </div>

      <div class="transactions-section"></div>
    </div>
  </div>
}
